services:
  localstack:
    image: localstack/localstack:3.8.0
    container_name: ghn-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,sqs,secretsmanager,lambda,iam,logs
      - LAMBDA_DOCKER_NETWORK=aws-workshop_default
      - AWS_DEFAULT_REGION=ap-southeast-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack-data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: coollabsio/minio:latest
    container_name: ghn-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    user: "0:0"
    container_name: ghn-iceberg-rest
    depends_on:
      - minio
    ports:
      - "8181:8181"
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password123
      - AWS_REGION=ap-southeast-1
      - CATALOG_WAREHOUSE=s3://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000
      - CATALOG_S3_PATH__STYLE__ACCESS=true
      - CATALOG_URI=jdbc:sqlite:/catalog/catalog.db
    volumes:
      - iceberg-catalog:/catalog
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8181'"]
      interval: 5s
      timeout: 5s
      retries: 5

  trino:
    image: trinodb/trino:435
    container_name: ghn-trino-athena
    depends_on:
      - minio
      - iceberg-rest
    ports:
      - "8080:8080"
    volumes:
      - "./docker/trino/etc/catalog:/etc/trino/catalog"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localstack-data:
  minio-data:
  iceberg-catalog:

networks:
  default:
    name: aws-workshop_default
